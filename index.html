<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Casamento Janaína & Octávio</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- =========================

TELA INICIAL

========================= -->

<div
    id="inicio"
    class="tela"
>

    <div class="container">

        <h1>💍 Janaína & Octávio</h1>

        <p class="subtitulo">
            Compartilhe os melhores momentos do nosso casamento ❤️
        </p>


        <button
            class="botao principal"
            onclick="abrirOpcoesFoto()"
        >

            📷 Enviar Foto

        </button>


        <button
            class="botao"
            onclick="abrirSenha()"
        >

            🔐 Validação

        </button>


        <button
            class="botao"
            onclick="visualizarFotos()"
        >

            🖼️ Visualizar Arquivos

        </button>


    </div>

</div>



<!-- =========================

ESCOLHER FOTO

========================= -->

<div
    id="opcoesFoto"
    class="tela escondido"
>

    <div class="container">

        <h2>Como deseja enviar?</h2>

        <p class="subtitulo">
            Escolha uma opção
        </p>


        <button
            class="botao principal"
            onclick="tirarFoto()"
        >

            📸 Tirar uma Foto

        </button>


        <button
            class="botao"
            onclick="escolherGaleria()"
        >

            🖼️ Escolher da Galeria

        </button>


        <button
            class="botao voltar"
            onclick="voltarInicio()"
        >

            ← Voltar

        </button>

    </div>

</div>



<!-- =========================

PRÉ-VISUALIZAÇÃO

========================= -->

<div
    id="previewTela"
    class="tela escondido"
>

    <div class="container">

        <h2>📷 Sua Foto</h2>


        <img
            id="previewImagem"
            class="preview-imagem"
        >


        <p id="nomeArquivo"></p>


        <button
            class="botao principal"
            onclick="enviarParaServidor()"
        >

            ☁️ Enviar Foto

        </button>


        <button
            class="botao voltar"
            onclick="abrirOpcoesFoto()"
        >

            ← Escolher Outra

        </button>


        <p
            id="statusUpload"
            class="status"
        ></p>

    </div>

</div>



<!-- =========================

SENHA

========================= -->

<div
    id="senhaTela"
    class="tela escondido"
>

    <div class="container">

        <h2>🔐 Área de Validação</h2>


        <input
            type="password"
            id="senha"
            placeholder="Digite a senha"
        >


        <button
            class="botao principal"
            onclick="validarSenha()"
        >

            Entrar

        </button>


        <button
            class="botao voltar"
            onclick="voltarInicio()"
        >

            ← Voltar

        </button>


        <p
            id="erroSenha"
            class="erro"
        ></p>

    </div>

</div>



<!-- =========================

VALIDAÇÃO

========================= -->

<div
    id="validacaoTela"
    class="tela escondido"
>

    <div class="container grande">

        <h2>🔐 Fotos Aguardando Aprovação</h2>


        <div
            id="listaFotos"
            class="galeria-admin"
        ></div>


        <button
            class="botao atualizar"
            onclick="carregarFotosPendentes()"
        >

            🔄 Atualizar Fotos

        </button>


        <button
            class="botao voltar"
            onclick="voltarInicio()"
        >

            ← Sair

        </button>

    </div>

</div>



<!-- =========================

INPUTS ESCONDIDOS

========================= -->


<!-- CÂMERA -->

<input
    type="file"
    id="inputCamera"
    accept="image/*"
    capture="environment"
    class="escondido"
    onchange="fotoSelecionada(event)"
>


<!-- GALERIA -->

<input
    type="file"
    id="inputGaleria"
    accept="image/*"
    class="escondido"
    onchange="fotoSelecionada(event)"
>



<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="script.js"></script>


</body>

</html>
